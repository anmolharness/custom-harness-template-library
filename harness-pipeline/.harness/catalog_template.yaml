apiVersion: harness.io/v1
kind: Workflow
name: Create Pipeline from Template
identifier: createpipelinefromtemplate
type: harness_pipeline
owner: group:default/HSF_Admins
metadata:
  description: Self-service workflow for developers to create a pipeline in a chosen Org/Project from an existing Harness Template Library template
  tags:
    - account-management
    - solutions-factory
    - harness
    - pipeline
spec:
  parameters:
    - title: Request Pipeline
      required:
        - organization_id
        - project_id
        - pipeline_name
        - template_ref
      properties:
        # The token property needs to be in the first page of the workflow
        token:
          title: Harness Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
        organization_id:
          title: Harness Organization
          type: string
          description: Select the organization the pipeline will be created in
          ui:field: HarnessOrgPicker
          ui:autofocus: true
          default: Choose One
        project_id:
          title: Harness Project
          type: string
          description: Select the project the pipeline will be created in
          ui:field: HarnessProjectPicker
        pipeline_name:
          title: Pipeline Name
          type: string
          description: Name for the new pipeline (must be unique within the project)
          maxLength: 128
        # Dynamic list of account-scope pipeline templates, fetched live via the
        # logged-in user's session token (no proxy / app-config needed). Each user
        # only sees templates they have access to. Resolves to an "account.<id>"
        # templateRef in locals.tf; the stable version is always used.
        template_ref:
          title: Pipeline Template
          type: string
          description: Select an account-level pipeline template to instantiate
          ui:field: HarnessEntitySelector
          ui:options:
            path: /template/api/templates/list
            method: POST
            params:
              templateListType: Stable
              page: "0"
              size: "100"
            body:
              filterType: Template
              templateEntityTypes:
                - Pipeline
            arraySelector: data.content
            valueSelector: identifier
            labelSelector: name
            placeholder: Search pipeline templates
    - title: Solutions Factory Connection
      properties:
        solutions_factory_details:
          title: Solutions Factory Details
          type: object
          description: |
            ---
            Harness URL : <+<+variable.account.solutions_factory_endpoint>.replaceFirst("/*$","")>

            Harness Account : <+account.identifier>

            Solutions Factory Org : <+variable.account.solutions_factory_org>

            Solutions Factory Project : <+variable.account.solutions_factory_project>
          required:
            - harness_account_url
            - harness_account_id
            - harness_org_id
            - harness_project_id
            - template_library_connector
            - template_library_repo
            - template_library_branch
            - template_library_directory
          properties:
            harness_account_url:
              type: string
              default: <+<+variable.account.solutions_factory_endpoint>.replaceFirst("/*$","")>
              ui:widget: hidden
            harness_account_id:
              type: string
              default: <+account.identifier>
              ui:widget: hidden
            harness_org_id:
              type: string
              default: <+variable.account.solutions_factory_org>
              ui:widget: hidden
            harness_project_id:
              type: string
              default: <+variable.account.solutions_factory_project>
              ui:widget: hidden
            template_library_connector:
              type: string
              default: <+variable.account.custom_template_library_connector>
              ui:widget: hidden
            template_library_repo:
              type: string
              default: <+variable.account.custom_template_library_repo>
              ui:widget: hidden
            template_library_branch:
              type: string
              default: main
              ui:widget: hidden
            template_library_directory:
              type: string
              default: harness-pipeline
              ui:widget: hidden
        solutions_factory_opts:
          title: Solutions Factory Workflow Options
          type: object
          required:
            - repo_source
            - workspace_type
          properties:
            repo_source:
              type: string
              # Used to group by source the workspaces for bulk actions
              default: "custom"
              ui:widget: hidden
            workspace_type:
              type: string
              # Used to group by type the workspaces for bulk actions
              default: harness-pipeline
              ui:widget: hidden
            is_ephemeral:
              type: string
              # Pipelines are persistent resources; keep the workspace around.
              default: "false"
              ui:widget: hidden
            requires_approval:
              type: string
              default: "false"
              ui:widget: hidden
            use_mini_factory:
              type: string
              default: <+variable.account.enable_hsf_mini_factory>
              ui:widget: hidden
  steps:
    - id: configure_workspace
      name: Creating Pipeline from Template
      action: trigger:harness-custom-pipeline
      input:
        url: ${{ parameters.solutions_factory_details.harness_account_url }}/ng/account/${{ parameters.solutions_factory_details.harness_account_id }}/all/orgs/${{ parameters.solutions_factory_details.harness_org_id }}/projects/${{ "hws_" if parameters.solutions_factory_opts.use_mini_factory=="true" else "" }}${{ parameters.organization_id if parameters.solutions_factory_opts.use_mini_factory=="true" else parameters.solutions_factory_details.harness_project_id }}/pipelines/Create_and_Manage_IACM_Workspaces/pipeline-studio?storeType=INLINE
        inputset:
          GIT_REPOSITORY_CONNECTOR: ${{ parameters.solutions_factory_details.template_library_connector }}
          GIT_REPOSITORY_NAME: ${{ parameters.solutions_factory_details.template_library_repo }}
          GIT_REPOSITORY_BRANCH: ${{ parameters.solutions_factory_details.template_library_branch }}
          GIT_REPOSITORY_PATH: ${{ parameters.solutions_factory_details.template_library_directory }}
          RESOURCE_NAME: ${{ parameters.organization_id }}_${{ parameters.project_id }}_${{ parameters.pipeline_name|replace(" ","-") }}
          RESOURCE_OWNER: group:default/Account_Admins
          RESOURCE_VARS:
            harness_platform_account: ${{ parameters.solutions_factory_details.harness_account_id }}
            organization_id: ${{ parameters.organization_id }}
            project_id: ${{ parameters.project_id }}
            pipeline_name: ${{ parameters.pipeline_name }}
            template_ref: ${{ parameters.template_ref }}
          RESOURCE_VARS_ENVS: {}
          RESOURCE_VARS_ENVS_SECRET: {}
          RESOURCE_VARS_SECRETS: {}
          INCLUDE_HARNESS_ENVS: "true"
          WORKSPACE_TAGS:
            source: ${{ parameters.solutions_factory_opts.repo_source }}
            type: ${{ parameters.solutions_factory_opts.workspace_type }}
          IS_EPHEMERAL: ${{ parameters.solutions_factory_opts.is_ephemeral }}
          REQUIRES_APPROVAL: ${{ parameters.solutions_factory_opts.requires_approval }}
        apikey: ${{ parameters.token }}
        showOutputVariables: true
  output:
    links:
      - title: Open Pipeline
        url: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.pipeline_url']}}
    text:
      - title: Outputs
        content: |
          Pipeline Details

          organization_identifier: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.organization_identifier']}}

          project_identifier: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.project_identifier']}}

          pipeline_identifier: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.pipeline_identifier']}}

          pipeline_url: ${{ steps.configure_workspace.output['pipeline.stages.Provision.spec.execution.steps.Provision.steps.apply.output.outputVariables.pipeline_url']}}
